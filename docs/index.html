<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServicePilot 在线 Demo</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #f2f5f7;
      --panel: #ffffff;
      --line: #dde4ea;
      --ink: #15222e;
      --muted: #65758a;
      --accent: #0f766e;
      --accent-soft: #d9f0ec;
      --ok: #15803d;
      --warn: #b45309;
      --warn-soft: #fdeeda;
      --danger: #b42318;
      --danger-soft: #fde8e4;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 10px 28px rgba(15, 23, 42, .07);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      background: #10212b;
      color: #f5f8fa;
      flex: 0 0 auto;
    }
    .brand {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2dd4bf, #0ea5e9);
      display: grid;
      place-items: center;
      color: #fff;
      flex: 0 0 auto;
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0; }
    .brand-sub { font-size: 12px; color: #9fb3c1; }
    .status-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(45, 212, 191, .14);
      color: #8df3e3;
      font-size: 12px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #2dd4bf; box-shadow: 0 0 0 3px rgba(45, 212, 191, .18); }
    .repo-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cfe0ea;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #304955;
      border-radius: 7px;
    }
    .repo-link:hover { background: rgba(255, 255, 255, .06); }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr) 352px;
      gap: 14px;
      padding: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 700;
      color: #33465a;
      flex: 0 0 auto;
    }
    .panel-head .sub { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 12px; }

    .sidebar { padding: 10px; gap: 10px; }
    .sidebar .panel-head { padding: 10px 6px; border-bottom: 0; }
    .scenario-list { display: flex; flex-direction: column; gap: 9px; overflow-y: auto; min-height: 0; }
    .scenario-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      color: var(--ink);
      transition: border-color .15s ease, background .15s ease;
    }
    .scenario-btn:hover { border-color: #a9c6cf; background: #f8fbfc; }
    .scenario-btn.active { border-color: var(--accent); background: var(--accent-soft); }
    .scenario-icon {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #fff;
      flex: 0 0 auto;
    }
    .scenario-name { font-size: 13px; font-weight: 600; line-height: 1.25; }
    .scenario-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .risk-tag {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .risk-ok { background: #e2f4e8; color: var(--ok); }
    .risk-mid { background: #fdf0dc; color: var(--warn); }
    .risk-high { background: #fde7e4; color: var(--danger); }

    .chat { min-height: 0; }
    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fbfcfd;
    }
    .message {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      animation: rise .18s ease both;
    }
    .message.user { align-self: flex-end; background: #116a63; color: #fff; border-bottom-right-radius: 2px; }
    .message.bot { align-self: flex-start; background: #eef2f5; border: 1px solid var(--line); border-bottom-left-radius: 2px; }
    .message.meta { align-self: center; font-size: 12px; color: #8192a5; background: transparent; border: 0; padding: 2px 0; }
    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: #fff;
      flex: 0 0 auto;
    }
    .chat-input input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 11px;
      color: var(--ink);
      outline: none;
    }
    .chat-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); }
    .send-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .send-btn:disabled { opacity: .55; cursor: not-allowed; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      flex: 0 0 auto;
    }
    .metric { min-width: 0; }
    .metric-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .metric-value {
      font-size: 14px;
      font-weight: 700;
      color: #23384a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trace-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 14px 14px;
    }
    .evidence-links {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 14px 14px;
      border-top: 1px solid var(--line);
    }
    .evidence-links a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid #cfe8e3;
      background: #f2fbf9;
      border-radius: 6px;
      padding: 5px 8px;
    }
    .evidence-links a:hover { background: var(--accent-soft); }
    .trace-step {
      display: flex;
      gap: 11px;
      padding: 10px 0;
      border-bottom: 1px dashed #e3e9ee;
      opacity: .4;
      transition: opacity .15s ease;
    }
    .trace-step.active { opacity: 1; }
    .trace-step.done { opacity: .92; }
    .step-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #c7d2dc;
      margin-top: 5px;
      flex: 0 0 auto;
    }
    .trace-step.active .step-dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(15, 118, 110, .15); }
    .trace-step.done .step-dot { background: var(--ok); }
    .trace-step.done.warn .step-dot { background: var(--warn); }
    .trace-step.done.danger .step-dot { background: var(--danger); }
    .step-agent { font-size: 12px; font-weight: 700; color: #20374a; }
    .step-title { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .step-detail { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    @media (max-width: 1020px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(420px, 52vh) minmax(320px, 40vh);
      }
      .scenario-list { flex-direction: row; flex-wrap: wrap; }
      .scenario-btn { width: calc(50% - 5px); }
      .chat { order: 2; }
      .trace { order: 3; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 0 12px; }
      .brand-sub, .repo-link span { display: none; }
      .repo-link { padding: 7px; }
      .workspace { padding: 10px; gap: 10px; grid-template-rows: auto minmax(380px, 60vh) minmax(300px, 45vh); }
      .scenario-btn { width: 100%; }
      .message { max-width: 92%; }
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><i data-lucide="bot" width="18" height="18"></i></div>
      <div>
        <div class="brand-name">ServicePilot</div>
        <div class="brand-sub">智能客服多 Agent 自主闭环系统</div>
      </div>
      <div class="status-pill"><span class="status-dot"></span>系统在线</div>
      <a class="repo-link" href="https://github.com/11ssyyhh/servicepilot-demo" target="_blank" rel="noreferrer">
        <i data-lucide="github" width="15" height="15"></i><span>GitHub</span>
      </a>
    </header>

    <main class="workspace">
      <aside class="panel sidebar">
        <div class="panel-head">
          <i data-lucide="sparkles" width="15" height="15"></i>
          演示场景
        </div>
        <div class="scenario-list" id="scenarioList"></div>
      </aside>

      <section class="panel chat">
        <div class="metrics">
          <div class="metric">
            <div class="metric-label">当前意图</div>
            <div class="metric-value" id="metricIntent">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">风险等级</div>
            <div class="metric-value" id="metricRisk">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">紧急度</div>
            <div class="metric-value" id="metricUrgency">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">链路耗时</div>
            <div class="metric-value" id="metricTime">-</div>
          </div>
        </div>
        <div class="chat-scroll" id="chatScroll">
          <div class="message meta">ServicePilot 已就绪</div>
        </div>
        <div class="chat-input">
          <input id="chatInput" type="text" placeholder="输入客服问题或选择左侧场景" autocomplete="off">
          <button class="send-btn" id="sendBtn"><i data-lucide="send" width="15" height="15"></i>发送</button>
        </div>
      </section>

      <section class="panel trace">
        <div class="panel-head">
          <i data-lucide="activity" width="15" height="15"></i>
          Agent 链路
          <span class="sub" id="traceCount">0 / 0</span>
        </div>
        <div class="trace-list" id="traceList">
          <div class="message meta" style="padding:12px 2px">等待场景运行</div>
        </div>
        <div class="evidence-links" id="evidenceLinks"></div>
      </section>
    </main>
  </div>

          { agent: "IntentRouter", title: "意图路由", detail: "意图=other | 情绪=0.50 | 紧急度=normal" },
          { agent: "KnowledgeRetriever", title: "知识检索", detail: "检索到0条高相关结果，置信度=0.11，低于转人工阈值", mode: "warn" },
          { agent: "TaskPlanner", title: "任务规划", detail: "低置信度，规划转人工处理 | 整体风险=L0" },
          { agent: "ToolExecutor", title: "工具执行", detail: "TicketCreate -> L0 成功（转人工工单 TK20260816004）", mode: "danger" },
          { agent: "QualityGuard", title: "质量审核", detail: "合规检查通过，无敏感内容" },
          { agent: "Verifier", title: "效果验证", detail: "问题未解决，已转人工 | 满意度=0.30", mode: "danger" },
          { agent: "MemoryScribe", title: "记忆沉淀", detail: "已生成对话摘要和知识库更新建议" }
        ]
      }
    };


    const chatScroll = document.getElementById("chatScroll");
    const traceList = document.getElementById("traceList");
    const traceCount = document.getElementById("traceCount");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const scenarioList = document.getElementById("scenarioList");
    const metricIntent = document.getElementById("metricIntent");
    const metricRisk = document.getElementById("metricRisk");
    const metricUrgency = document.getElementById("metricUrgency");
    const metricTime = document.getElementById("metricTime");
    const evidenceLinks = document.getElementById("evidenceLinks");
    let running = false;

    function buildScenarios() {
      Object.entries(scenarios).forEach(([key, s]) => {
        const btn = document.createElement("button");
        btn.className = "scenario-btn";
        btn.dataset.key = key;
        btn.innerHTML = `
          <span class="scenario-icon" style="background:${s.color}"><i data-lucide="${s.icon}" width="16" height="16"></i></span>
          <span>
            <span class="scenario-name">${s.label}</span>
            <span class="scenario-desc">${s.desc}</span>
          </span>
          <span class="risk-tag ${s.riskClass}">${s.risk}</span>`;
        btn.addEventListener("click", () => runScenario(key));
        scenarioList.appendChild(btn);
      });
      refreshIcons();
    }

    function refreshIcons() {
      if (window.lucide) lucide.createIcons();
    }

    function scrollChat() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function addMessage(type, text) {
      const el = document.createElement("div");
      el.className = "message " + type;
      el.textContent = text;
      chatScroll.appendChild(el);
      scrollChat();
      return el;
    }

    function resetTrace() {
      traceList.innerHTML = "";
      traceCount.textContent = "0 / 0";
      metricIntent.textContent = "-";
      metricRisk.textContent = "-";
      metricUrgency.textContent = "-";
      metricTime.textContent = "-";
      evidenceLinks.innerHTML = "";
    }

    function addTraceStep(step, index, total) {
      if (traceList.firstChild && traceList.firstChild.classList.contains("meta")) {
        traceList.innerHTML = "";
      }
      const el = document.createElement("div");
      el.className = "trace-step";
      const mode = step.mode || "";
      el.innerHTML = `
        <span class="step-dot"></span>
        <span style="min-width:0">
          <div class="step-agent">${step.agent}</div>
          <div class="step-title">${step.title}</div>
          <div class="step-detail">${step.detail}</div>
        </span>`;
      if (mode) el.classList.add(mode);
      traceList.appendChild(el);
      traceCount.textContent = `${index + 1} / ${total}`;
      traceList.scrollTop = traceList.scrollHeight;
      return el;
    }

    function matchScenario(text) {
      if (/订单|物流|快递|到哪/.test(text)) return "order";
      if (/地址|收货/.test(text)) return "address";
      if (/退货|换货|退回/.test(text)) return "return";
      if (/退款|退钱/.test(text)) return "refund";
      if (/投诉|客服太差|态度|举报/.test(text)) return "complaint";
      if (/天气|你好|你是谁|其他/.test(text)) return "unknown";
      return null;
    }

    async function runScenario(key) {
      if (running) return;
      const s = scenarios[key];
      running = true;
      sendBtn.disabled = true;
      document.querySelectorAll(".scenario-btn").forEach(b => b.classList.toggle("active", b.dataset.key === key));
      resetTrace();
      addMessage("user", s.user);
      const startedAt = performance.now();
      metricIntent.textContent = s.label;
      metricRisk.textContent = s.risk;
      metricUrgency.textContent = s.urgency;

      for (let i = 0; i < s.steps.length; i++) {
        const step = s.steps[i];
        const el = addTraceStep(step, i, s.steps.length);
        await wait(step.mode === "warn" ? 900 : 480);
        el.classList.add("done");
      }

      const elapsed = Math.max(800, Math.round(performance.now() - startedAt));
      metricTime.textContent = (elapsed / 1000).toFixed(1) + "s";
      addMessage("bot", s.reply);
      evidenceLinks.innerHTML = [
        'trace.jsonl', 'logs.jsonl', 'metrics.json', 'session.json', 'summary.json', 'eval_report.json'
      ].map(name => `<a href="evidence/${name}" target="_blank">${name}</a>`).join("");
      running = false;
      sendBtn.disabled = false;
      refreshIcons();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    sendBtn.addEventListener("click", () => {
      const text = chatInput.value.trim();
      if (!text || running) return;
      const key = matchScenario(text) || "order";
      chatInput.value = "";
      runScenario(key);
    });

    chatInput.addEventListener("keydown", e => {
      if (e.key === "Enter") sendBtn.click();
    });

    buildScenarios();
  </script>
</body>
</html>
